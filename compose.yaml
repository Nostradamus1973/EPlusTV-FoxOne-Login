services:
  eplustv:
    build:
      context: .
      dockerfile: Dockerfile
    image: eplustv:foxone-profile-login
    container_name: eplustv
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /opt/eplustv/config:/app/config
    # Required on the current privileged LXC host because Docker cannot load
    # docker-default from inside the container. Remove on a normal Docker host.
    security_opt:
      - apparmor=unconfined
